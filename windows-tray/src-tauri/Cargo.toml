[package]
name = "ccf-deadlines-tray"
version = "0.1.3"
description = "A Windows tray companion for CCF Deadlines with hover preview and pinning"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
